name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - feat/develop
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        run: npm run test:ci

      - name: Build and package
        run: npm run package

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: material-map-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
